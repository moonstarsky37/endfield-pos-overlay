[project]
name = "endfield-pos-overlay"
version = "0.2.0"
description = "Always-on-top overlay for the live position from the official Endfield web map"
readme = "README.en.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
endfield-pos-overlay = "endfield_pos_overlay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["endfield_pos_overlay"]
